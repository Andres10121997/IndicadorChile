name: Docker Compose

on:
  workflow_dispatch:

jobs:
  call-env-file:
    name: Call env file
    uses: ./.github/workflows/env-file.yaml
    secrets: inherit # Pasa los secretos al flujo hijo

  call-dev-certs-file:
    name: Call dev certs file
    uses: ./.github/workflows/dev-certs-file.yaml
    secrets: inherit
  
  buid-docker-compose:
    name: Build Docker Compose
    
    runs-on: ubuntu-latest

    needs: [call-dev-certs-file, call-env-file]

    steps:
      - name: Checkout repository and submodules
        id: checkoutCode
        uses: actions/checkout@v7 # Obtiene el código de tu repositorio
        with:
          # Opciones: 'true' para submódulos de primer nivel o 'recursive' para todos
          submodules: recursive

      - name: Descargar archivo .env
        uses: actions/download-artifact@v8
        with:
          name: env-file
          path: . # Asegura que esté en la raíz del proyecto

      - name: Descargar archivo dev certs
        uses: actions/download-artifact@v8
        with:
          name: dev-certs-pfx
          path: .

      - name: Levantar servicios
        run: docker compose up --build -d

      - name: Esperar y verificar estado
        run: docker compose ps

      # - name: Verificar que el archivo existe y usarlo
        # run: |
          # ls -la
          # cat .env
      
      - name: Eliminar .env local por seguridad
        if: always()
        run: rm -f .env
