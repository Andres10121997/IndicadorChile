name: Create and share a .env file

on:
  workflow_call:
  
  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions o a través de la API HTTP.
  workflow_dispatch:

jobs:
  env:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        id: checkoutCode
        uses: actions/checkout@v7 # Obtiene el código de tu repositorio
        with:
          # Opciones: 'true' para submódulos de primer nivel o 'recursive' para todos
          submodules: recursive

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          # Zona Horaria
          "TimeZone=America/Santiago"

          # Idioma
          "LANG=es_CL.UTF-8"
          "LANGUAGE=es_CL:es"
          "LC_ALL=es_CL.UTF-8"
          EOF

      - name: Verify that the file was created
        run: ls -lah && cat .env

      - name: Upload .env file as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: env-file
          path: .env
          include-hidden-files: true # ¡Muy importante para archivos que empiezan con punto!
          if-no-files-found: error
