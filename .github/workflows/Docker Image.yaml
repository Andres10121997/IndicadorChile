name: Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push-docker-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: API
            os: ubuntu-latest
            dockerfile: ./API/Dockerfile
            image_name: ${{ vars.IMAGE_NAME }}/api
            context: .

          - project: Web
            os: ubuntu-latest
            dockerfile: ./IndicadorChileWeb/Dockerfile
            image_name: ${{ vars.IMAGE_NAME }}/web
            context: ./IndicadorChileWeb

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository and submodules
      id: checkoutCode
      uses: actions/checkout@v7 # Obtiene el código de tu repositorio
      with:
        # Opciones: 'true' para submódulos de primer nivel o 'recursive' para todos
        submodules: recursive
        # Si tus submódulos están en repositorios privados, 
        # necesitarás un Token de Acceso Personal (PAT) con permisos de lectura:
        token: ${{ secrets.DOCKER_TOKEN }}

    - name: Log in to GitHub Container Registry
      id: logInGitHub
      uses: docker/login-action@v4 # Permite iniciar sesión en el registro de contenedores
      with:
        registry: ghcr.io # Usa el registro de contenedores de GitHub
        username: ${{ github.actor }} # Usa tu nombre de usuario de GitHub
        password: ${{ secrets.DOCKER_TOKEN }} # Usa el token de acceso personal guardado como secreto

    - name: Build and push Docker image
      id: buildPushImage
      uses: docker/build-push-action@v7 # Acción para construir y subir imágenes de Docker
      with:
        context: ${{ matrix.context }} # Construye desde el directorio raíz del proyecto
        file: ${{ matrix.dockerfile }}
        push: true # Sube la imagen al registro después de construirla
        tags: | # Asigna etiquetas a la imagen
          ghcr.io/${{ matrix.image_name }}:${{ github.sha }}
          ghcr.io/${{ matrix.image_name }}:latest
