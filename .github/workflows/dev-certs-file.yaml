name: Create and share a dev certs file

on:
  workflow_call:
  
  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions o a través de la API HTTP.
  workflow_dispatch:

jobs:
  dev-certs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        id: checkoutCode
        uses: actions/checkout@v7 # Obtiene el código de tu repositorio
        with:
          # Opciones: 'true' para submódulos de primer nivel o 'recursive' para todos
          submodules: recursive

      # https://github.com/actions/setup-dotnet
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
      
      - name: Create dev certs file
        run: |
          mkdir -p certs
          dotnet dev-certs https --clean
          dotnet dev-certs https -ep cert.pfx -p TU_CONTRASEÑA
          chmod 644 certs/aspnetapp.pfx

      - name: Upload dev certs file as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-certs-pfx
          path: certs/aspnetapp.pfx
          retention-days: 1
          if-no-files-found: error
