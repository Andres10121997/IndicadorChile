name: Submodules Sync

on:
  schedule:
    # Actualiza el disparador cron del flujo de trabajo actual de GitHub Action basándose en una lista de expresiones cron.
    - cron: '0 */1 * * 1-5'
  
  workflow_call:
  
  # Permite ejecutar este flujo de trabajo manualmente desde la pestaña Actions o a través de la API HTTP.
  workflow_dispatch:

jobs:
  sync:
    name: Submodules Sync
    
    runs-on: ubuntu-latest

    # defaults:
      # run:
        # shell: bash
    
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7 # Obtiene el código de tu repositorio
        with:
          # Opciones: 'true' para submódulos de primer nivel o 'recursive' para todos
          submodules: recursive
          # Si tus submódulos están en repositorios privados, 
          # necesitarás un Token de Acceso Personal (PAT) con permisos de lectura:
          token: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Git Submodule Update
        run: |
          git pull --recurse-submodules
          git submodule update --remote --recursive

      - name: Git config
        run: |
          git config --global user.name 'Git bot'
          git config --global user.email 'bot@noreply.github.com'
      
      - name: Commit Update
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.DOCKER_TOKEN }}@github.com/${{ github.repository }}
          git commit -am "Referencias de submódulos actualizadas automáticamente." && git push || echo "No hay cambios que confirmar."
