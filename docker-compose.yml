# https://learn.microsoft.com/es-mx/visualstudio/containers/tutorial-multicontainer?view=visualstudio
# https://learn.microsoft.com/es-mx/visualstudio/containers/launch-profiles?view=visualstudio
services:
    # Servicio API
    api:
        build:
            context: IndicadorChileAPI
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}api
        container_name: indicadores_de_chile_api
        read_only: true
        restart: always

        user: 1000:1000
        tmpfs:
            - /tmp
        
        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        # cap_add:
            # - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Certificado SSL embebido en la imagen
            - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
            - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
            # Aplicación
            - AppName=Indicadores de Chile (API)
            - AppDescription=API para obtener, principalmente, la lista de distintas "divisas", como la UF y el Dólar.
        networks:
            - backend-tier
        ports:
            - "1970:8080"
            - "1973:8081" # 127.0.0.1:1973:8081
        volumes:
            # - '/path/to/host/uptime/:/app/data'
            - ./certs:/https:ro
    
    # Servicio web
    web:
        build:
            context: IndicadorChileWeb
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}web
        container_name: indicadores_de_chile_web
        read_only: true
        restart: always
        
        user: 1000:1000
        tmpfs:
            - /tmp

        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Certificado SSL embebido en la imagen
            - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
            - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
        networks:
            - frontend-tier
            - backend-tier
        ports:
            - "8080:8080"
            - "8081:8081"
        volumes:
            # - '/path/to/host/uptime/:/app/data'
            - ./certs:/https:ro

networks:
    frontend-tier:
        driver: bridge
    backend-tier:
        driver: bridge
        internal: true