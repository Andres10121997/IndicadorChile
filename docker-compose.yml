# https://learn.microsoft.com/es-mx/visualstudio/containers/tutorial-multicontainer?view=visualstudio
# https://learn.microsoft.com/es-mx/visualstudio/containers/launch-profiles?view=visualstudio
services:
    # Contenedor auxiliar: Genera el certificado en el volumen interno y termina
    cert-ssl:
        image: mcr.microsoft.com/dotnet/sdk:8.0
        container_name: certificado-ssl

        user: 1000:1000
        
        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
        
        entrypoint: >
            sh -c '
            if [ ! -f /https/aspnetapp.pfx ]; then
                dotnet dev-certs https -ep /https/aspnetapp.pfx -p "$$CERT_PASSWORD" &&
                chmod 644 /https/aspnetapp.pfx;
            fi
            '
        environment:
            - CERT_PASSWORD=${CERT_PASSWORD}
        volumes:
            - ssl_data:/https
    
    # Servicio API
    api:
        build:
            context: IndicadorChileAPI
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}api
        container_name: indicadores_de_chile_api
        read_only: true
        restart: always
        depends_on:
            cert-ssl:
                condition: service_completed_successfully

        user: 1000:1000
        tmpfs:
            - /tmp
        
        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        # cap_add:
            # - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Certificado SSL embebido en la imagen
            - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
            - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
            # Aplicación
            - AppName=Indicadores de Chile (API)
            - AppDescription=API para obtener, principalmente, la lista de distintas "divisas", como la UF y el Dólar.
        networks:
            - backend-tier
            # - backend-internal-tier
            # - backend-external-tier
        ports:
            - "1970:8080"
            - "1973:8081"
        volumes:
            - '/path/to/host/uptime/:/app/data'
            - ssl_data:/https:ro
    
    # Servicio web
    web:
        build:
            context: IndicadorChileWeb
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}web
        container_name: indicadores_de_chile_web
        read_only: true
        restart: always
        depends_on:
            cert-ssl:
                condition: service_completed_successfully
        
        user: 1000:1000
        
        tmpfs:
            - /tmp

        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Certificado SSL embebido en la imagen
            - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
            - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
        networks:
            - typescript-transpile-tier
            - frontend-tier
        ports:
            - "8080:8080"
            - "8081:8081"
        volumes:
            - '/path/to/host/uptime/:/app/data'
            - ssl_data:/https:ro

networks:
    red_internet:
        driver: bridge
        internal: false # Por defecto es false; si fuera true, bloquearía el acceso exterior
    typescript-transpile-tier:
        driver: bridge
        internal: true # Sin salida a internet ni puerta de enlace predeterminada
        external: false
    backend-tier:
        driver: bridge
    frontend-tier:
        driver: bridge

volumes:
    ssl_data: