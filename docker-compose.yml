# https://learn.microsoft.com/es-mx/visualstudio/containers/tutorial-multicontainer?view=visualstudio
# https://learn.microsoft.com/es-mx/visualstudio/containers/launch-profiles?view=visualstudio
services:
    # Servicio transpilar TypeScript
    typescript-transpile:
        image: node:26-alpine
        working_dir: /app
        
        security_opt:
            - no-new-privileges:true
        
        networks:
            - typescript-compiler-tier
        volumes:
            - .:/app
        # Instala TypeScript y transpila (usa --watch si es para desarrollo)
        command: sh -c "npm install -g typescript && tsc --watch"
    
    # Servicio API
    api:
        build:
            context: IndicadorChileAPI
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}api
        container_name: indicadores_de_chile_api
        read_only: true
        restart: always
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
            # Aplicación
            - AppName=Indicadores de Chile (API)
            - AppDescription=API para obtener, principalmente, la lista de distintas "divisas", como la UF y el Dólar.
        networks:
            - backend-tier
        ports:
            - "1970:8080"
            - "1973:8081"
        volumes:
            # Configuración del almacenamiento persistente
            - '/path/to/host/uptime/:/app/data'
            # Microsoft
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    
    # Servicio web
    web:
        build:
            context: IndicadorChileWeb
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}web
        container_name: indicadores_de_chile_web
        restart: always
        depends_on:
            - typescript-transpile
        
        # Seguridad
        read_only: true
        user: 1000:1000
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
        networks:
            - typescript-compiler-tier
        ports:
            - "8080:8080"
            - "8081:8081"
        volumes:
            # Configuración del almacenamiento persistente
            - '/path/to/host/uptime/:/app/data'
            # Microsoft
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro

networks:
    typescript-compiler-tier:
        driver: bridge
        internal: true # Sin salida a internet ni puerta de enlace predeterminada
    backend-tier:
        driver: bridge
        internal: true # Sin salida a internet ni puerta de enlace predeterminada