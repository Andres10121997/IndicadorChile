# https://learn.microsoft.com/es-mx/visualstudio/containers/tutorial-multicontainer?view=visualstudio
# https://learn.microsoft.com/es-mx/visualstudio/containers/launch-profiles?view=visualstudio
services:
    # Contenedor auxiliar: Genera el certificado en el volumen interno y termina
    cert-gen:
        image: mcr.microsoft.com/dotnet/sdk:8.0
        container_name: certificado-ssl
        
        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        entrypoint: >
            sh -c '
            if [ ! -f /https/aspnetapp.pfx ]; then
                dotnet dev-certs https -ep /https/aspnetapp.pfx -p "$$CERT_PASSWORD" &&
                chmod 644 /https/aspnetapp.pfx;
            fi
            '
        environment:
            - CERT_PASSWORD=${CERT_PASSWORD}
        volumes:
            - ssl_data:/https
    
    # Contenedor auxiliar: Transpilar TypeScript
    typescript-transpile:
        image: node:26-alpine
        restart: always
        working_dir: /app

        # Instala TypeScript y transpila (usa --watch si es para desarrollo)
        command: sh -c "npm install -g typescript && tsc --watch"
        
        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        networks:
            - typescript-compiler-tier
        volumes:
            - .:/app
    
    # Servicio API
    api:
        build:
            context: IndicadorChileAPI
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}api
        container_name: indicadores_de_chile_api
        read_only: true
        restart: always
        depends_on:
            cert-gen:
                condition: service_completed_successfully

        user: 1000:1000
        tmpfs:
            - /tmp
        
        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        # cap_add:
            # - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Certificado SSL embebido en la imagen
            - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
            - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
            # Aplicación
            - AppName=Indicadores de Chile (API)
            - AppDescription=API para obtener, principalmente, la lista de distintas "divisas", como la UF y el Dólar.
        networks:
            - backend-tier
        ports:
            - "1970:8080"
            - "1973:8081"
        volumes:
            - '/path/to/host/uptime/:/app/data'
            - ssl_data:/https:ro
    
    # Servicio web
    web:
        build:
            context: IndicadorChileWeb
            dockerfile: Dockerfile
        image: ${DOCKER_REGISTRY-}web
        container_name: indicadores_de_chile_web
        read_only: true
        restart: always
        depends_on:
            typescript-transpile:
                condition: service_started
            cert-gen:
                condition: service_completed_successfully
        
        user: 1000:1000
        tmpfs:
            - /tmp

        # Seguridad
        security_opt:
            - "no-new-privileges=true"
        
        # Capacidades
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Certificado SSL embebido en la imagen
            - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
            - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
            # Time Zone
            - TZ=${TimeZone}
            # Idioma
            - LANG=${LANG}
            - LANGUAGE=${LANGUAGE}
            - LC_ALL=${LC_ALL}
        networks:
            - typescript-compiler-tier
            - frontend-tier
        ports:
            - "8080:8080"
            - "8081:8081"
        volumes:
            - '/path/to/host/uptime/:/app/data'
            - ssl_data:/https:ro

networks:
    typescript-compiler-tier:
        driver: bridge
        internal: true # Sin salida a internet ni puerta de enlace predeterminada
    backend-tier:
        driver: bridge
    frontend-tier:
        driver: bridge

volumes:
    ssl_data: