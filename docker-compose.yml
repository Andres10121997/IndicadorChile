# https://learn.microsoft.com/es-mx/visualstudio/containers/tutorial-multicontainer?view=visualstudio
# https://learn.microsoft.com/es-mx/visualstudio/containers/launch-profiles?view=visualstudio
version: "3.9"

services:
    typescript-compiler:
        image: node:26-alpine
        working_dir: /app
        volumes:
            - .:/app
        # Instala TypeScript y transpila (usa --watch si es para desarrollo)
        command: sh -c "npm install -g typescript && tsc --watch"
    
    api:
        image: ${DOCKER_REGISTRY-}api
        container_name: indicadores_de_chile_api
        restart: always
        ports:
            - "1970:8080"
            - "1973:8081"
        build:
            context: IndicadorChileAPI
            dockerfile: Dockerfile
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Time Zone
            - TZ=America/Santiago
            # Idioma
            - LANG=es_CL.UTF-8
            - LANGUAGE=es_CL:es
            - LC_ALL=es_CL.UTF-8
            # Aplicación
            - AppName=Indicadores de Chile (API)
            - AppDescription=API para obtener, principalmente, la lista de distintas "divisas", como la UF y el Dólar.
        volumes:
            # Configuración del almacenamiento persistente
            - '/path/to/host/uptime/:/app/data'
            # Microsoft
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    
    web:
        image: ${DOCKER_REGISTRY-}web
        container_name: indicadores_de_chile_web
        restart: always
        depends_on:
            - typescript-compiler
            - api
        ports:
            - "8080:8080"
            - "8081:8081"
        build:
            context: IndicadorChileWeb
            dockerfile: Dockerfile
        environment:
            # Asp Net Core
            - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
            - ASPNETCORE_HTTP_PORTS=8080
            - ASPNETCORE_HTTPS_PORTS=8081
            # Time Zone
            - TZ=America/Santiago
            # Idioma
            - LANG=es_CL.UTF-8
            - LANGUAGE=es_CL:es
            - LC_ALL=es_CL.UTF-8
        volumes:
            # Configuración del almacenamiento persistente
            - '/path/to/host/uptime/:/app/data'
            # Microsoft
            - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
            - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
